<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="brassGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#fae8b4"/>
      <stop offset="45%" stop-color="#dfc37b"/>
      <stop offset="75%" stop-color="#9a7732"/>
      <stop offset="100%" stop-color="#5a4114"/>
    </radialGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8b4"/>
      <stop offset="25%" stop-color="#c9a24b"/>
      <stop offset="50%" stop-color="#73521b"/>
      <stop offset="75%" stop-color="#dfc37b"/>
      <stop offset="100%" stop-color="#5a4114"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rim with Drop Shadow -->
  <circle cx="100" cy="100" r="92" fill="#16141c" stroke="url(#ringGradient)" stroke-width="4" filter="url(#sealShadow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#c9a24b" stroke-width="1" stroke-dasharray="3,3" opacity="0.75"/>
  <circle cx="100" cy="100" r="76" fill="#100e15" stroke="url(#ringGradient)" stroke-width="2"/>
  
  <!-- Archival Compass Star / Flourish -->
  <g transform="translate(100, 100)" stroke="#c9a24b" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="-70" x2="0" y2="70"/>
    <line x1="-70" y1="0" x2="70" y2="0"/>
    <circle cx="0" cy="0" r="45" fill="none"/>
  </g>

  <!-- MK Monogram -->
  <text x="100" y="112" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#brassGradient)" text-anchor="middle" letter-spacing="4">MK</text>
  
  <!-- Micro Archival Subtext -->
  <text x="100" y="132" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#dfc37b" text-anchor="middle" letter-spacing="3" opacity="0.85">VAULT · ARCHIVE</text>
  
  <!-- Decorative Dots -->
  <circle cx="100" cy="62" r="2.5" fill="#dfc37b"/>
  <circle cx="100" cy="144" r="2.5" fill="#dfc37b"/>
</svg>